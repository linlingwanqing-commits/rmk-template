name: Build Firmware (ESP32-S3 Xtensa)

on:
  push:
    branches: [main, master, s46r]
  workflow_dispatch:

env:
  RUST_MIN_STACK: 67108864

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install Rust (nightly)
        run: |
          rustup update nightly
          rustup component add rust-src --toolchain nightly
          rustup target add xtensa-esp32s3-none-elf

      - name: Install espup (ESP toolchain installer)
        run: |
          cargo install espup
          espup install
          echo "source ~/export-esp.sh" >> ~/.bashrc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            esp32_planck59/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('esp32_planck59/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build firmware for ESP32-S3 (Xtensa)
        working-directory: esp32_planck59
        run: |
          source ~/export-esp.sh
          cargo +esp build --release
        shell: bash
        env:
          RUST_MIN_STACK: 67108864

      - name: Convert to binary format
        working-directory: esp32_planck59
        run: |
          source ~/export-esp.sh
          # 安装 espflash（仅用于转换）
          cargo install espflash --quiet
          
          # ELF 文件路径
          ELF_FILE="target/xtensa-esp32s3-none-elf/release/rmk-esp32s3"
          
          if [ -f "$ELF_FILE" ]; then
            # 生成 .bin 文件
            espflash save-image --chip esp32s3 "$ELF_FILE" ./firmware.bin
            echo "✅ Firmware binary created: firmware.bin"
            ls -lh ./firmware.bin
          else
            echo "❌ ELF file not found!"
            echo "Available files:"
            ls -la target/xtensa-esp32s3-none-elf/release/
            exit 1
          fi
        shell: bash

      - name: List build artifacts
        working-directory: esp32_planck59
        run: |
          echo "📦 Build artifacts:"
          echo "ELF file:"
          ls -lh target/xtensa-esp32s3-none-elf/release/rmk-esp32s3
          echo ""
          echo "Binary file:"
          ls -lh firmware.bin 2>/dev/null || echo "No firmware.bin found"

      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: rmk-esp32s3-firmware
          path: |
            esp32_planck59/firmware.bin
            esp32_planck59/target/xtensa-esp32s3-none-elf/release/rmk-esp32s3
          if-no-files-found: error
          compression-level: 9

      - name: Upload build logs (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            esp32_planck59/target/debug/build/
            esp32_planck59/target/release/build/
          if-no-files-found: ignore