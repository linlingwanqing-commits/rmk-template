name: Build Firmware (ESP32-S3)

on:
  push:
    branches: [ main, master, s46r ]
  workflow_dispatch:

env:
  RUST_MIN_STACK: 67108864

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install Rust
        run: |
          rustup update stable
          # ESP32-S3 目标架构
          rustup target add riscv32imc-unknown-none-elf
          # 如果使用 Xtensa 架构（官方 Rust 支持需要额外配置）
          # rustup target add xtensa-esp32s3-none-elf
          rustup component add rust-src

      - name: Install cargo-espflash (ESP32 烧录工具)
        run: |
          cargo install cargo-espflash
          cargo install espflash

      - name: Install esp toolchain
        run: |
          cargo install espup
          espup install
          source ~/export-esp.sh
        shell: bash

      - name: Build firmware
        working-directory: esp32_planck59
        run: |
          source ~/export-esp.sh
          cargo build --release
        shell: bash

      - name: Build firmware for ESP32-S3
        working-directory: esp32_planck59   # 你的项目目录
        run: cargo build --release
        env:
          RUST_MIN_STACK: 67108864

      - name: Convert to binary format (optional)
        working-directory: esp32_planck59
        run: |
          # 生成 .bin 文件用于烧录
          espflash save-image --chip esp32s3 target/riscv32imc-unknown-none-elf/release/your-firmware-name ./firmware.bin
        continue-on-error: true

      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: esp32_planck59
          path: esp32_planck59/*.bin