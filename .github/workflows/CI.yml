name: Build Firmware (ESP32-S3 Xtensa)

on:
  push:
    branches: [main, master, s46r]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup ESP32-S3 toolchain
        uses: esp-rs/xtensa-toolchain@v1
        with:
          target: esp32s3
          default: true

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "esp32_planck59"
          cache-targets: false

      - name: Build firmware
        working-directory: esp32_planck59
        run: |
          cargo build --release
        env:
          RUST_MIN_STACK: 67108864

      - name: Install espflash
        run: cargo install espflash --quiet

      - name: Convert to binary
        working-directory: esp32_planck59
        run: |
          espflash save-image --chip esp32s3 target/xtensa-esp32s3-none-elf/release/rmk-esp32s3 ./firmware.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: rmk-esp32s3-firmware
          path: esp32_planck59/firmware.bin
          if-no-files-found: error