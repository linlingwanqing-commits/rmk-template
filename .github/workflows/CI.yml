name: Build Firmware (ESP32-S3)

on:
  push:
    branches: [main, master, s46r]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup toolchain install nightly
          rustup component add rust-src --toolchain nightly
          rustup target add xtensa-esp32s3-none-elf

      - name: Install espup
        run: |
          source "$HOME/.cargo/env"
          cargo install espup
          espup install --target=esp32s3

      - name: Build firmware
        working-directory: esp32_planck59
        run: |
          source "$HOME/.cargo/env"
          source ~/export-esp.sh
          cargo +esp build --release

      - name: Install espflash
        run: |
          source "$HOME/.cargo/env"
          cargo install espflash --quiet

      - name: Convert to binary
        working-directory: esp32_planck59
        run: |
          source ~/export-esp.sh
          espflash save-image --chip esp32s3 target/xtensa-esp32s3-none-elf/release/rmk-esp32s3 ./firmware.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: rmk-esp32s3-firmware
          path: esp32_planck59/firmware.bin