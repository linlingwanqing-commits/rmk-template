name: Build Firmware

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build ESP32-S3 firmware
        uses: esp-rs/esp-build@v1
        with:
          chip: esp32s3
          directory: esp32_planck59
          
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: esp32_planck59/firmware.bin