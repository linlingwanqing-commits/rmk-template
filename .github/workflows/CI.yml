name: Build Firmware (ESP32-S3)

on:
  push:
    branches: [main, master, s46r]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src

      - name: Install espup
        run: |
          cargo install espup

      - name: Install ESP toolchain
        run: |
          espup install --targets esp32s3

      - name: Set ESP environment
        run: |
          source $HOME/export-esp.sh

      - name: Build firmware
        working-directory: esp32_planck59
        run: |
          source $HOME/export-esp.sh
          cargo +esp build --release

      - name: Install espflash
        run: |
          cargo install espflash --quiet

      - name: Generate binary
        working-directory: esp32_planck59
        run: |
          source $HOME/export-esp.sh
          # 添加 planck59 的查找
          if [ -f target/xtensa-esp32s3-none-elf/release/planck59 ]; then
            espflash save-image --chip esp32s3 target/xtensa-esp32s3-none-elf/release/planck59 ./firmware.bin
          elif [ -f target/xtensa-esp32s3-none-elf/release/rmk-esp32s3 ]; then
            espflash save-image --chip esp32s3 target/xtensa-esp32s3-none-elf/release/rmk-esp32s3 ./firmware.bin
          elif [ -f target/xtensa-esp32s3-none-elf/release/esp32_planck59 ]; then
            espflash save-image --chip esp32s3 target/xtensa-esp32s3-none-elf/release/esp32_planck59 ./firmware.bin
          else
            echo "No ELF file found!"
            ls -la target/xtensa-esp32s3-none-elf/release/
            exit 1
          fi

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: planck59-firmware
          path: esp32_planck59/firmware.bin